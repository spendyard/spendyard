name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The core and the providers must keep building without files, a clock or the OS, and the providers without
      # reqwest: Spendyard Cloud runs them in a Worker, posting with its fetch.
      - name: Build the core for wasm32
        run: cargo build -p spendyard-core -p spendyard-wasm --target wasm32-unknown-unknown --locked

      # At the version crates/wasm pins.
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Install wasm-opt
        run: sudo apt-get install -y binaryen

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build @spendyard/core
        run: scripts/build-wasm.sh

      - name: Read every fixture both ways
        run: node crates/wasm/tests/compare.mjs

      - name: Read with the pipeline, the host posting
        run: node crates/wasm/tests/understand.mjs

