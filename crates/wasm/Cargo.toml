# The core for a JavaScript host, through wasm-bindgen: what Spendyard Cloud's
# Worker reads documents with. Built by scripts/build-wasm.sh into pkg/, the
# npm package @spendyard/core.
[package]
name = "spendyard-wasm"
description = "The Spendyard core for JavaScript: reads receipts and invoices in a Worker or a browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spendyard-core.workspace = true
# The providers, posting through the host's function rather than reqwest.
spendyard-models = { workspace = true, default-features = false }
async-trait.workspace = true
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
