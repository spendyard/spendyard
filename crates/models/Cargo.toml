# The model providers: Anthropic, OpenAI, Gemini, OpenAI-compatible and
# SystemOne over HTTP, implementing the core's Extractor and Decider. The CLI
# uses them; Spendyard Cloud calls its models itself.
[package]
name = "spendyard-models"
description = "The model providers Spendyard reads documents with."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spendyard-core.workspace = true
async-trait.workspace = true
base64.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
