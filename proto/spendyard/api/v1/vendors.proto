syntax = "proto3";

package spendyard.api.v1;

import "buf/validate/validate.proto";
import "spendyard/api/v1/documents.proto";
import "spendyard/api/v1/model.proto";
import "spendyard/api/v1/options.proto";

// VendorService is the active organisation's vendors: who it pays, worked
// out from its receipts by the CLI's own code, with what each has cost
// month by month (subscriptions, usage, one-offs), its seats over time, and
// its subscriptions, cards and accounts. Its documents are those whose
// vendor (Document.vendor) is it.
//
// What people decide about a vendor is kept by its ID and applied before
// anything is worked out, so receipts that come later follow it, and
// subscriptions see it too: its name, merging it into another, its
// category, that it's personal or not spend, who looks after it, a note.
//
// Amounts are in the organisation's currency, as SubscriptionService's. A
// member sees the vendors in the receipts they added, and changes those
// they look after; the owner and admins change any; an accountant reads.
service VendorService {
  // ListVendors lists the vendors, the most spent on this past year first.
  rpc ListVendors(ListVendorsRequest) returns (ListVendorsResponse) {
    option (spendyard.api.v1.permission) = "vendors:read";
  }
  // GetVendor gives one vendor, whatever was decided about it. NOT_FOUND
  // when it isn't the caller's to see, or was merged into another.
  rpc GetVendor(GetVendorRequest) returns (GetVendorResponse) {
    option (spendyard.api.v1.permission) = "vendors:read";
  }
  // UpdateVendor keeps what someone decided about a vendor: the fields
  // given, the rest as they were. PERMISSION_DENIED for a member who
  // doesn't look after it.
  rpc UpdateVendor(UpdateVendorRequest) returns (UpdateVendorResponse) {
    option (spendyard.api.v1.permission) = "vendors:write";
  }
  // ListOwnVendors lists the organisation's own vendors, by name: those it
  // added because the catalog lacked them, and its own view of any the
  // catalog has.
  rpc ListOwnVendors(ListOwnVendorsRequest) returns (ListOwnVendorsResponse) {
    option (spendyard.api.v1.permission) = "vendors:read";
  }
  // SetOwnVendor keeps a vendor of the organisation's own, by its domain:
  // added, or replaced when it's there. It goes on top of the catalog for
  // this organisation only, as the CLI's local vendor files do: receipts
  // and card payments are found by its domains, names and statement
  // descriptors from then on, those already in too; one with a catalog
  // vendor's domain replaces that vendor. The owner and admins only:
  // PERMISSION_DENIED for a member.
  rpc SetOwnVendor(SetOwnVendorRequest) returns (SetOwnVendorResponse) {
    option (spendyard.api.v1.permission) = "vendors:write";
  }
  // DeleteOwnVendor takes one away: its receipts go back to the catalog's
  // vendor, or to the names they show. NOT_FOUND when there's none by that
  // domain. The owner and admins only.
  rpc DeleteOwnVendor(DeleteOwnVendorRequest) returns (DeleteOwnVendorResponse) {
    option (spendyard.api.v1.permission) = "vendors:write";
  }
}

// OwnVendor is a vendor the organisation added itself, in the catalog's
// terms.
message OwnVendor {
  // Its main domain, which is its ID: `fjordbyra.no`.
  string domain = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 200
    pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  }];
  // The name to show.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string category = 3 [(buf.validate.field).string = {
    in: [
      "ai",
      "dev-tools",
      "infrastructure",
      "observability",
      "security",
      "data",
      "design",
      "productivity",
      "communication",
      "analytics",
      "marketing",
      "sales",
      "support",
      "finance",
      "hr",
      "legal",
      "education",
      "other"
    ]
  }];
  // Other names on its receipts: legal, old, trading names.
  repeated string aliases = 4 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        min_len: 1
        max_len: 200
      }
    }
  }];
  // Other domains its site and mail use; subdomains match too.
  repeated string domains = 5 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        min_len: 3
        max_len: 200
        pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
      }
    }
  }];
  // How its charges start on card statements, when its name alone doesn't
  // find them: `FJORDBYRA AS`.
  repeated string descriptors = 6 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        min_len: 2
        max_len: 100
      }
    }
  }];
  // How it charges: `seat`, `usage`, `plan`, `one_time`.
  repeated string pricing = 7 [(buf.validate.field).repeated = {
    max_items: 4
    unique: true
    items: {
      string: {
        in: [
          "seat",
          "usage",
          "plan",
          "one_time"
        ]
      }
    }
  }];
}

message ListOwnVendorsRequest {}

message ListOwnVendorsResponse {
  repeated OwnVendor vendors = 1;
}

message SetOwnVendorRequest {
  OwnVendor vendor = 1 [(buf.validate.field).required = true];
}

message SetOwnVendorResponse {
  OwnVendor vendor = 1;
}

message DeleteOwnVendorRequest {
  string domain = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 200
  }];
}

message DeleteOwnVendorResponse {}

// One month of a vendor's spend, in the organisation's currency: plain
// decimals (`20.00`).
message VendorMonth {
  // YYYY-MM.
  string month = 1;
  // On subscriptions, on usage, and one-offs, as receipts say.
  string subscription = 2;
  string usage = 3;
  string other = 4;
  // Paid with no receipt (a statement's payment): what for isn't known, so
  // it isn't guessed into the others.
  string unreceipted = 6;
  // The most seats any of its receipts that month paid for; 0 when none
  // said.
  double seats = 5;
}

// Vendor is one vendor the organisation pays.
message Vendor {
  // Its ID: the catalog's (its domain) when the catalog knows it, else its
  // name's key.
  string id = 1;
  string name = 2;
  // `ai`, `dev-tools`, `infrastructure`, …; empty when nobody knows.
  string category = 3;
  // Its domain, for its icon (/icons/<domain>); empty when unknown.
  string domain = 4;
  // The vendor catalog knows it.
  bool known = 5;
  // What it cost this past year, and what its active subscriptions cost a
  // month together: plain decimals in the response's currency.
  string spent_year = 6;
  string monthly = 7;
  // Its paid receipts, each once; payments with no receipt are `payments`.
  int32 receipts = 8;
  // Its first and last payment, YYYY-MM-DD.
  string first_paid = 9;
  string last_paid = 10;
  // How many subscriptions it has, live or not.
  int32 subscriptions = 11;
  // The past twelve months, oldest first.
  repeated VendorMonth months = 12;
  // Every card it was paid with, the most recently used first.
  repeated UsedCard cards = 13;
  // The accounts its receipts name: workspaces, emails.
  repeated string accounts = 14;
  // Who in the organisation looks after it; unset when nobody's been set.
  UserRef owner = 15;
  string note = 17;
  // Marked personal, or as not spend at all: its receipts aren't the
  // organisation's spend.
  bool personal = 18;
  bool not_spend = 19;
  // The vendors merged into this one: their IDs.
  repeated string merged = 20;
  // Its payments on card statements with no receipt: counted in its spend,
  // and missing their receipts.
  int32 payments = 21;
  // Set when it's one of the organisation's own vendors (SetOwnVendor).
  OwnVendor own = 22;
  // The documents it was worked out from (DocumentService), merges and all.
  repeated int32 document_ids = 23;
}

message ListVendorsRequest {
  // Only those whose name holds this, whatever its case.
  string query = 1 [(buf.validate.field).string.max_len = 200];
  // Only this category's.
  string category = 2 [(buf.validate.field).string.max_len = 100];
  // Also those marked personal or not spend.
  bool include_all = 3;
}

message ListVendorsResponse {
  repeated Vendor vendors = 1;
  // The currency the amounts are in.
  string currency = 2;
}

message GetVendorRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

message GetVendorResponse {
  Vendor vendor = 1;
  string currency = 2;
}

message UpdateVendorRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Its name as it should be shown; empty puts the catalog's or the
  // receipts' back.
  optional string name = 2 [(buf.validate.field).string.max_len = 200];
  // Merge it into another vendor (Vendor.id); empty undoes a merge.
  optional string merge_into = 3 [(buf.validate.field).string.max_len = 200];
  // Its category; empty puts the catalog's back.
  optional string category = 4 [(buf.validate.field).string.max_len = 100];
  optional bool personal = 5;
  optional bool not_spend = 6;
  // Who looks after it: a member's user ID; empty for nobody.
  optional string owner_id = 7 [(buf.validate.field).string.max_len = 100];
  optional string note = 8 [(buf.validate.field).string.max_len = 2000];
}

message UpdateVendorResponse {
  // As it is now; unset when it was merged into another.
  Vendor vendor = 1;
  string currency = 2;
}
