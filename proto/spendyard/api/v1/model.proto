syntax = "proto3";

package spendyard.api.v1;

import "google/protobuf/timestamp.proto";

// User is someone who signs in to Spendyard Cloud.
message User {
  string id = 1;
  string email = 2;
  // What they're called; their email until they say.
  string name = 3;
  // A picture from the provider they signed in with, if any.
  string image_url = 4;
}

// Role is what someone may do in an organisation.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Everything, billing and handing the organisation on among it.
  ROLE_OWNER = 1;
  // Everything but Spendyard's own billing.
  ROLE_ADMIN = 2;
  // Their own receipts and the tools they own.
  ROLE_MEMBER = 3;
  // Every receipt and export, read-only. Usually from outside the company.
  ROLE_ACCOUNTANT = 4;
}

// Org is a company on Spendyard Cloud, with one shared store of receipts.
message Org {
  string id = 1;
  // In addresses and the CLI: "fjordtech".
  string slug = 2;
  string name = 3;
  google.protobuf.Timestamp create_time = 4;
  // The currency its amounts are shown in, ISO 4217 ("NOK"); empty for the
  // one it pays in most.
  string currency = 5;
}

// Membership is a user's place in one organisation.
message Membership {
  Org org = 1;
  Role role = 2;
}

// VendorRef is a vendor as something points at it: a receipt's, a
// subscription's, a payment's. As the organisation's vendors have it
// (VendorService), merges and names decided included.
message VendorRef {
  // The vendor's ID: Vendor.id.
  string id = 1;
  string name = 2;
  // Its domain, for its icon (/icons/<domain>); empty when unknown.
  string domain = 3;
}

// UserRef is a person as something points at them: who looks after a
// vendor, who confirmed a receipt.
message UserRef {
  // The user's ID: User.id.
  string id = 1;
  // Their name, or their email without one.
  string name = 2;
}
