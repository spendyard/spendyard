syntax = "proto3";

package spendyard.api.v1;

import "buf/validate/validate.proto";
import "spendyard/api/v1/model.proto";
import "spendyard/api/v1/options.proto";

// OrgService creates organisations and moves between them. Every other
// service acts in the session's active organisation.
service OrgService {
  // CreateOrg creates an organisation with the caller as its owner, and
  // makes it the session's active one.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse) {
    option (spendyard.api.v1.permission) = "orgs:create";
  }
  // ListOrgs lists the organisations the caller belongs to, and what they may
  // do in the active one.
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse) {
    option (spendyard.api.v1.permission) = "orgs:read";
  }
  // SwitchOrg makes another of the caller's organisations the active one for
  // this session. NOT_FOUND when they're not in it.
  rpc SwitchOrg(SwitchOrgRequest) returns (SwitchOrgResponse) {
    option (spendyard.api.v1.permission) = "orgs:switch";
  }
}

message CreateOrgRequest {
  // The company's name: "Fjordtech AS". Its slug comes from it.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
}

message CreateOrgResponse {
  Membership membership = 1;
}

message ListOrgsRequest {}

message ListOrgsResponse {
  // The session's active organisation; empty when the caller is in none.
  string active_org_id = 1;
  // In the order they joined.
  repeated Membership memberships = 2;
  // The permissions the caller holds in the active organisation, those anyone
  // signed in holds among them, e.g. "members:manage": for clients to offer
  // only what they may do. The server checks every call anyway.
  repeated string permissions = 3;
}

message SwitchOrgRequest {
  // A slug of an organisation the caller belongs to.
  string slug = 1 [(buf.validate.field).string.min_len = 1];
}

message SwitchOrgResponse {
  Membership membership = 1;
}
