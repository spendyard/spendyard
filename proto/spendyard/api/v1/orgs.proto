syntax = "proto3";

package spendyard.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "spendyard/api/v1/model.proto";
import "spendyard/api/v1/options.proto";

// OrgService creates organisations and moves between them. Every other
// service acts in the session's active organisation.
service OrgService {
  // CreateOrg creates an organisation with the caller as its owner, and
  // makes it the session's active one.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse) {
    option (spendyard.api.v1.permission) = "orgs:create";
  }
  // ListOrgs lists the organisations the caller belongs to, and what they may
  // do in the active one.
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse) {
    option (spendyard.api.v1.permission) = "orgs:read";
  }
  // SwitchOrg makes another of the caller's organisations the active one for
  // this session. NOT_FOUND when they're not in it.
  rpc SwitchOrg(SwitchOrgRequest) returns (SwitchOrgResponse) {
    option (spendyard.api.v1.permission) = "orgs:switch";
  }
  // ListMembers lists the people in the active organisation, the owner
  // first.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (spendyard.api.v1.permission) = "members:read";
  }
  // UpdateMemberRole makes someone an admin, a member or an accountant. Not
  // the owner, and not to owner: that's TransferOwnership.
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {
    option (spendyard.api.v1.permission) = "members:manage";
    option (spendyard.api.v1.interactive_only) = true;
  }
  // RemoveMember takes someone out of the active organisation, and their
  // sessions acting in it move to another of theirs. Anyone may remove
  // themselves (leaving); someone else takes an admin or the owner. Never
  // the owner: they hand it on first (TransferOwnership).
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (spendyard.api.v1.permission) = "members:remove";
    option (spendyard.api.v1.interactive_only) = true;
  }
  // TransferOwnership hands the organisation to one of its admins, who
  // becomes its owner; the caller, its owner until then, becomes an admin.
  // Owner only.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {
    option (spendyard.api.v1.permission) = "orgs:transfer";
    option (spendyard.api.v1.interactive_only) = true;
  }
  // UpdateOrg changes the active organisation's name; the owner and admins.
  // Its slug stays: it's in links and the CLI's commands.
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse) {
    option (spendyard.api.v1.permission) = "orgs:manage";
  }
  // DeleteOrg deletes the active organisation and everything Spendyard keeps
  // for it. The owner only, with its slug typed as confirmation. It's gone
  // for its members at once, and they're told by email; its invites and
  // invite link stop working. 30 days later its receipts, originals and
  // everything else are deleted for good; until then Spendyard's support can
  // restore it. Backups keep it until they age out (90 days).
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse) {
    option (spendyard.api.v1.permission) = "orgs:delete";
    option (spendyard.api.v1.interactive_only) = true;
  }
}

message CreateOrgRequest {
  // The company's name: "Fjordtech AS". Its slug comes from it.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
}

message CreateOrgResponse {
  Membership membership = 1;
}

message ListOrgsRequest {}

message ListOrgsResponse {
  // The session's active organisation; empty when the caller is in none.
  string active_org_id = 1;
  // In the order they joined.
  repeated Membership memberships = 2;
  // The permissions the caller holds in the active organisation, those anyone
  // signed in holds among them, e.g. "members:manage": for clients to offer
  // only what they may do. The server checks every call anyway.
  repeated string permissions = 3;
}

message SwitchOrgRequest {
  // A slug of an organisation the caller belongs to.
  string slug = 1 [(buf.validate.field).string.min_len = 1];
}

message SwitchOrgResponse {
  Membership membership = 1;
}

// Member is someone in an organisation.
message Member {
  User user = 1;
  Role role = 2;
  // How they joined: "created" (made the organisation), "invite", "link".
  string joined_via = 3;
  google.protobuf.Timestamp joined_at = 4;
  // When a session of theirs acting in the organisation was last used;
  // unset when unknown.
  google.protobuf.Timestamp last_active_at = 5;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
}

message UpdateMemberRoleRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // ROLE_ADMIN, ROLE_MEMBER or ROLE_ACCOUNTANT.
  Role role = 2 [(buf.validate.field).enum = {
    defined_only: true
    in: [
      2,
      3,
      4
    ]
  }];
}

message UpdateMemberRoleResponse {
  Member member = 1;
}

message RemoveMemberRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RemoveMemberResponse {}

message TransferOwnershipRequest {
  // An admin of the organisation, who becomes its owner.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

message TransferOwnershipResponse {}

message UpdateOrgRequest {
  // The organisation's new name, e.g. "Fjordtech AS"; trimmed.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
}

message UpdateOrgResponse {
  // The caller's membership in it, with its new name.
  Membership membership = 1;
}

// Why an organisation is deleted, to learn from; optional.
enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  LEAVE_REASON_TOO_EXPENSIVE = 1;
  LEAVE_REASON_MISSING_FEATURE = 2;
  LEAVE_REASON_HARD_TO_SET_UP = 3;
  LEAVE_REASON_OTHER_TOOL = 4;
  LEAVE_REASON_JUST_TRYING = 5;
  LEAVE_REASON_OTHER = 6;
}

message DeleteOrgRequest {
  // The active organisation's slug, typed again: it must match.
  string slug = 1 [(buf.validate.field).string.min_len = 1];
  LeaveReason reason = 2;
  // In the person's own words; kept by Spendyard without any of the
  // organisation's data.
  string reason_text = 3 [(buf.validate.field).string.max_len = 2000];
}

message DeleteOrgResponse {}
