syntax = "proto3";

package spendyard.api.v1;

import "buf/validate/validate.proto";
import "spendyard/api/v1/model.proto";
import "spendyard/api/v1/options.proto";

// AccountService is the signed-in person's own account. It follows them
// across organisations, and anyone signed in may use it.
service AccountService {
  // GetAccount returns the caller's profile.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (spendyard.api.v1.permission) = "account:read";
  }
  // UpdateProfile changes what the caller is called.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (spendyard.api.v1.permission) = "account:write";
  }
}

message Account {
  User user = 1;
}

message GetAccountRequest {}

message GetAccountResponse {
  Account account = 1;
}

message UpdateProfileRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
}

message UpdateProfileResponse {
  Account account = 1;
}
