syntax = "proto3";

package spendyard.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "spendyard/api/v1/model.proto";
import "spendyard/api/v1/options.proto";

// DocumentService is the active organisation's documents: what arrived (files
// dropped in the browser, forwarded mail, later mailboxes and the CLI's
// pushes, PushService), where each is in being read, what was read from it, and checking
// and correcting that. Reading happens on its own, in the background, as each
// arrives.
//
// A receipt, an invoice, a renewal notice or a failed payment is a document:
// what was read from it is on it (vendor, total, day, what paid it), and so
// is what people decided about it (checked, a note, personal, set aside).
// Only what was paid is spend: a receipt, or a paid invoice (`paid`, and
// `paid_by` for how that's known). The review queue is every document with
// something flagged, not checked and not set aside.
//
// Files go to and come from the blob store directly, by signed URL, not
// through the API: CreateDocumentUpload gives a URL to PUT a file to,
// AddDocument takes it in, GetDocumentOriginal gives a URL to download one
// from.
service DocumentService {
  // ListDocuments lists the documents, newest first, a page at a time. A
  // member sees the ones they added; the owner, admins and an accountant see
  // them all.
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (spendyard.api.v1.permission) = "documents:read";
  }
  // CreateDocumentUpload gives a URL to PUT one file to, good for a few
  // minutes, and the headers to send with it. Once it's there, AddDocument
  // takes it in. At most 25 MB. One call per file: several files are several
  // uploads, each taken in on its own.
  rpc CreateDocumentUpload(CreateDocumentUploadRequest) returns (CreateDocumentUploadResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
  // AddDocument takes in a file put where CreateDocumentUpload said: kept as
  // it came, once (the same bytes, or the same mail by Message-ID, are the
  // document there already), and queued to be read when it's new.
  rpc AddDocument(AddDocumentRequest) returns (AddDocumentResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
  // GetDocument gives one document whole, read or not: where it is in being
  // read, why it couldn't be, what it came as, and what was read from it,
  // with the quote behind each value, what the checks flagged, how it was
  // corrected and who checked it. NOT_FOUND when it isn't the caller's to
  // see.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse) {
    option (spendyard.api.v1.permission) = "documents:read";
  }
  // UpdateDocument corrects what was read by hand, says it's checked, or
  // marks it: the fields given, the rest as they were. A correction stays
  // when it's read again; reading it again puts it back in the review queue
  // when the new reading is flagged. NOT_FOUND when it isn't the caller's.
  rpc UpdateDocument(UpdateDocumentRequest) returns (UpdateDocumentResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
  // GetDocumentOriginal gives a URL to download a document as it came, good
  // for a few minutes. NOT_FOUND when it isn't the caller's to see, or its
  // original isn't kept.
  rpc GetDocumentOriginal(GetDocumentOriginalRequest) returns (GetDocumentOriginalResponse) {
    option (spendyard.api.v1.permission) = "documents:read";
  }
  // ReadDocumentAgain queues a document to be read again: one that failed,
  // or one whose reading should be redone. NOT_FOUND when it isn't the
  // caller's to see, or is being read now.
  rpc ReadDocumentAgain(ReadDocumentAgainRequest) returns (ReadDocumentAgainResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
  // DeleteDocument deletes a document for good: what was read from it (a
  // receipt, a statement's payments), what people decided about it, and its
  // original. A payment it was the receipt of is missing one again. It can
  // be added again afterwards. NOT_FOUND when it isn't the caller's to see;
  // FAILED_PRECONDITION while it's being read. Recorded in the activity log.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
}

// Where a document is in being read.
enum DocumentState {
  DOCUMENT_STATE_UNSPECIFIED = 0;
  // Waiting to be read.
  DOCUMENT_STATE_QUEUED = 1;
  // Being read now.
  DOCUMENT_STATE_READING = 2;
  // Read: what was read is in its reading.
  DOCUMENT_STATE_READ = 3;
  // Couldn't be read: `error` says why.
  DOCUMENT_STATE_FAILED = 4;
}

// Document is one document an organisation has, and what was read from it.
message Document {
  // The organisation's own number for it.
  int32 id = 1;
  // The file's name, or the mail's subject.
  string name = 2;
  // Where it came from: `upload:<user id>`, `forward:<address>`,
  // `cli:<user id>:<machine>`.
  string source = 3;
  // Who sent it, for mail.
  string sender = 4;
  // When it arrived, RFC 3339: the mail's date, or when it was uploaded.
  string received = 5;
  // `email`, `pdf`, `image`, `html`, `text`.
  string format = 6;
  int32 size = 7;
  DocumentState state = 8;
  // Why it couldn't be read, and at which stage (`read`, `options`,
  // `understand`); empty unless it failed.
  string error = 9;
  string error_stage = 10;
  // What was read, when it's about money: the total and its currency, and
  // the day it was issued (YYYY-MM-DD), or arrived when it doesn't say.
  reserved 11;
  reserved "vendor_name";
  string total = 12;
  string currency = 13;
  string date = 14;
  // What it is, as its reading says; unset until it's read.
  DocumentType type = 15;
  // The total in the organisation's currency, converted with the European
  // Central Bank's rate of its day, a plain decimal; empty when it's in that
  // currency already, or there's no rate to convert with.
  string converted_total = 16;
  string converted_currency = 17;
  // When it was last read, RFC 3339; empty when it hasn't been.
  string read_at = 18;
  // The payment it's evidence of (PaymentService); 0 when it's no payment's:
  // an invoice not paid, a notice, one set aside.
  int32 payment_id = 19;
  // Its vendor, as corrected if it was, as Vendors names it (merges and
  // all); unset when nothing says.
  VendorRef vendor = 20;
  // How many things the checks flagged when it was read.
  int32 flags = 21;
  // Someone checked it: it isn't waiting for review.
  bool confirmed = 22;
  // Marked by hand as personal, or as not spend at all (set aside).
  bool personal = 23;
  bool ignored = 24;
  // A note on it, by hand.
  string note = 25;
  // Where the payment stands, as it says.
  PaymentStatus status = 26;
  // Money was paid: a receipt, or a paid invoice. Only these are spend.
  bool paid = 27;
  // How it's known to be paid; unspecified when it isn't. It saying so
  // comes first, then a card payment, then a mark by hand.
  PaidBy paid_by = 28;
  // The card it says it was paid with, its last four digits.
  string card_last4 = 29;
  // The statement's line that paid it (matched, or linked by hand); unset
  // when none is.
  PaidWith paid_with = 30;
  // Of its bytes, lower-case hex: the same document wherever it is (the
  // CLI's store, another organisation's), whatever number each gives it.
  string sha256 = 31;
  // How it was corrected by hand, with when; unset when it wasn't. For a
  // client that keeps documents of its own (`spendyard cloud pull`).
  DocumentEdit edit = 32;
}

// PaidWith is the line on a card statement that paid a document.
message PaidWith {
  // Its id in TransactionService: `<statement>:<line>`.
  string transaction_id = 1;
  // Its day, YYYY-MM-DD.
  string date = 2;
  // The card as statements name it ("Mastercard 3776").
  string card = 3;
}

// How a document is known to have been paid.
enum PaidBy {
  // It isn't known to be.
  PAID_BY_UNSPECIFIED = 0;
  // It says so: a receipt, or an invoice read as paid.
  PAID_BY_DOCUMENT = 1;
  // A payment from a card statement is its, matched or linked by hand
  // (TransactionService): an invoice that only says what's due.
  PAID_BY_PAYMENT = 2;
  // Marked paid by hand (UpdateDocumentRequest.paid): paid some other way,
  // or before the card's statements are in.
  PAID_BY_HAND = 3;
}

// Which documents ListDocuments lists.
enum DocumentFilter {
  // All of them.
  DOCUMENT_FILTER_UNSPECIFIED = 0;
  // Those that couldn't be read.
  DOCUMENT_FILTER_FAILED = 1;
  // Those waiting to be read, or being read.
  DOCUMENT_FILTER_READING = 2;
  // Those read.
  DOCUMENT_FILTER_READ = 3;
}

message ListDocumentsRequest {
  // At most this many; 50 when unset.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  // The page after another: the last id it ended with.
  int32 before_id = 2;
  DocumentFilter filter = 3;
  // Only those whose name or sender holds this, whatever its case.
  string query = 4 [(buf.validate.field).string.max_len = 200];
  // Only those from this kind of source: `upload`, `forward`, `cli`, later
  // `gmail`, `outlook`, `imap`.
  string source = 5 [(buf.validate.field).string.pattern = "^[a-z]*$"];
  // Only those that arrived (received) at or after this time; unset for no
  // bound. A day in the asker's own time zone is from its midnight to the next.
  google.protobuf.Timestamp since = 6;
  // Only those that arrived before this time; unset for no bound.
  google.protobuf.Timestamp until = 7;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  // How many the request picks in all, every page together.
  int32 total = 2;
}

message ReadDocumentAgainRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message ReadDocumentAgainResponse {}

message DeleteDocumentRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}
message DeleteDocumentResponse {}

message CreateDocumentUploadRequest {
  // The file's name, as it was chosen.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // Its MIME type, as the browser says; empty when it doesn't.
  string content_type = 2 [(buf.validate.field).string.max_len = 255];
  // Its size in bytes.
  int32 size = 3 [(buf.validate.field).int32 = {
    gt: 0
    lte: 26214400
  }];
}

message CreateDocumentUploadResponse {
  // For AddDocument, once the file is there.
  string upload_id = 1;
  // Where to PUT it, and the headers to send with it.
  string url = 2;
  map<string, string> headers = 3;
}

message AddDocumentRequest {
  string upload_id = 1 [(buf.validate.field).string.min_len = 1];
}

message AddDocumentResponse {
  Document document = 1;
  // It was there already: the same file, or the same mail.
  bool seen = 2;
}

message GetDocumentRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message GetDocumentResponse {
  Document document = 1;
  // What it came as, each with its text, and a link to see and to download
  // the PDFs and pictures; none when the original isn't kept. Where the
  // reading's quotes are found.
  repeated DocumentPart parts = 2;
  // What was read; unset until it's read.
  Reading reading = 3;
  // A URL to show the original in the page, good for a few minutes: for a
  // PDF or a picture only, empty otherwise.
  string preview_url = 4;
  // Its corrections by hand; unset when there are none.
  DocumentEdit edit = 5;
  // Who checked it, and when; unset until someone has.
  DocumentConfirmation confirmation = 6;
}

message UpdateDocumentRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
  // The vendor's name as it should be; empty puts the reading's back.
  optional string vendor_name = 2 [(buf.validate.field).string.max_len = 200];
  // Personal, not the organisation's spend.
  optional bool personal = 3;
  // Not spend at all: a newsletter, a duplicate.
  optional bool ignored = 4;
  optional string note = 5 [(buf.validate.field).string.max_len = 2000];
  // Paid, though it doesn't say so: an invoice paid some other way, or
  // before the card's statements are in. False takes the mark away.
  optional bool paid = 6;
  // Checked: right as read, or as corrected. It leaves the review queue.
  // Only true: a document read again is checked again.
  optional bool confirmed = 7 [(buf.validate.field).bool.const = true];

  // Corrections to what was read, each kept through reading it again; empty
  // (DOCUMENT_TYPE_UNSPECIFIED for the type, 0 for seats) puts the
  // reading's back.
  //
  // The vendor it is: one of the organisation's vendors, by its ID (Vendor.id).
  optional string vendor_id = 8 [(buf.validate.field).string.max_len = 200];
  // The day it was issued or paid, YYYY-MM-DD.
  optional string date = 9 [(buf.validate.field).string.pattern = "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"];
  // What it is: a receipt, an invoice, a renewal notice, a payment that
  // failed, a credit note. Whether it's paid follows, as reading has it.
  optional DocumentType type = 10 [(buf.validate.field).enum.defined_only = true];
  // Its total, a plain decimal: 49.00.
  optional string total = 11 [(buf.validate.field).string.pattern = "^(-?[0-9]+(\\.[0-9]+)?)?$"];
  // Its currency, ISO 4217: USD.
  optional string currency = 12 [(buf.validate.field).string.pattern = "^([A-Za-z]{3})?$"];
  // Its receipt or invoice number, as it shows it.
  optional string number = 13 [(buf.validate.field).string.max_len = 100];
  // How many seats it's for.
  optional double seats = 14 [(buf.validate.field).double.gte = 0];
}

message UpdateDocumentResponse {
  Document document = 1;
}

// DocumentPart is one part of a document: the mail's body, an attachment,
// the PDF itself.
message DocumentPart {
  // Its position, as evidence names it.
  int32 index = 1;
  // `body`, `attachment:Invoice.pdf`, `forwarded:1/attachment:Invoice.pdf`.
  string label = 2;
  // `text`, `html`, `pdf`, `image`, `other`.
  string kind = 3;
  string mime = 4;
  // Its plain text: the text itself, HTML as text, a PDF's text layer. Empty
  // for pictures and for PDFs without one.
  string text = 5;
  // Its pages, for a PDF.
  int32 pages = 6;
  // A link to see it as it came, for a while: for a PDF or a picture (not
  // SVG), an email's attachments among them. Empty for the rest.
  string preview_url = 7;
  // A link to download it as it came, for a while, as a file named as it
  // was: for the same parts as preview_url.
  string download_url = 8;
}

message GetDocumentOriginalRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message GetDocumentOriginalResponse {
  // Where to GET it; it downloads under its own name.
  string url = 1;
}

// What a document is, as its reading says: the CLI's document types.
enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  // Proof that a payment was made.
  DOCUMENT_TYPE_RECEIPT = 1;
  // A request for payment, paid or not.
  DOCUMENT_TYPE_INVOICE = 2;
  // Says a charge is coming; nothing has been paid.
  DOCUMENT_TYPE_RENEWAL_NOTICE = 3;
  // A payment that didn't go through.
  DOCUMENT_TYPE_PAYMENT_FAILED = 4;
  // A card issuer's statement of many charges.
  DOCUMENT_TYPE_CARD_STATEMENT = 5;
  // Anything else: a newsletter, a login code, a quote.
  DOCUMENT_TYPE_OTHER = 6;
  // Money taken off what was billed or given back: a credit note, or a
  // refund's receipt. Its total is the amount credited, positive; status
  // paid when the money went back to a card or account, none when it is
  // credit on account or lowers an unpaid invoice. Spend counts one paid
  // back as money back, below nothing.
  DOCUMENT_TYPE_CREDIT_NOTE = 7;
}

// Reading is what was read from a document, as the CLI's `spendyard read`
// gives it: amounts are plain decimals (`1234.50`), days YYYY-MM-DD.
message Reading {
  // What the document is.
  DocumentType document_type = 1;
  // Money was paid: a receipt, or a paid invoice.
  bool is_receipt = 2;
  bool is_invoice = 3;
  PaymentStatus status = 4;
  // The model's own confidence, 0 to 1. Not calibrated.
  double confidence = 5;
  ReadVendor vendor = 6;
  ReadAmount amount = 7;
  ReadBilling billing = 8;
  repeated ReadLine lines = 9;
  repeated ReadPayment payments = 10;
  string invoice_number = 11;
  string receipt_number = 12;
  // On a credit note: the number of the invoice it credits, as written;
  // empty when it names none.
  string credited_invoice = 21;
  string issued = 13;
  // The quote behind each value, keyed by field path: `vendor.name`,
  // `amount.total`, `lines[0].amount`.
  map<string, Evidence> evidence = 14;
  // What the checks found wrong or doubtful. Empty is good.
  repeated Flag flags = 15;
  // Problems reading the input, such as parts that couldn't be sent.
  repeated string warnings = 16;
  // Which models read it, `provider/model`, and when.
  string extractor = 17;
  string model = 18;
  string decider = 19;
  google.protobuf.Timestamp read_at = 20;
}

message ReadVendor {
  string id = 1;
  string name = 2;
  // The name as printed, when it differs from `name`.
  string legal_name = 3;
  string category = 4;
  // Found in the vendor catalog.
  bool known = 5;
  // Who took the payment for it: `stripe`, `paddle`.
  string processor = 6;
  string account_email = 7;
  string account_workspace = 8;
  string account_customer_id = 9;
}

message ReadAmount {
  string total = 1;
  string subtotal = 2;
  string tax = 3;
  string currency = 4;
}

message ReadBilling {
  BillingModel model = 1;
  Interval interval = 2;
  string period_start = 3;
  string period_end = 4;
  string next_renewal = 5;
}

message ReadLine {
  LineKind kind = 1;
  string product = 2;
  string plan = 3;
  string description = 4;
  double quantity = 5;
  string unit = 6;
  string unit_price = 7;
  string amount = 8;
  Interval interval = 9;
}

message ReadPayment {
  PaymentMethod method = 1;
  string brand = 2;
  string last4 = 3;
  string amount = 4;
}

// Evidence is the quote behind one value.
message Evidence {
  string quote = 1;
  // The part it's from: DocumentPart.index.
  int32 part = 2;
  // The quote was found in the part's text. False when it wasn't, or the
  // part has no text to check against (a picture).
  bool checked = 3;
}

// Flag is one thing the checks found wrong or doubtful.
message Flag {
  // A stable code, such as `totals_dont_add_up`.
  string code = 1;
  // The field it's about, as evidence names fields; empty for the whole.
  string field = 2;
  string message = 3;
}

// DocumentEdit is how a document's reading was corrected, or marked, by hand.
message DocumentEdit {
  // The vendor as it should be; empty when the reading's stands.
  string vendor_name = 1;
  bool personal = 2;
  bool ignored = 3;
  string note = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Marked paid by hand.
  bool paid = 6;
  // Corrections to what was read, each empty (DOCUMENT_TYPE_UNSPECIFIED,
  // 0) when the reading's stands: the vendor chosen (its ID; vendor_name is
  // its name), the day, the type, the total and its currency, the number,
  // the seats.
  string vendor_id = 7;
  string date = 8;
  DocumentType type = 9;
  string total = 10;
  string currency = 11;
  string number = 12;
  double seats = 13;
}

message DocumentConfirmation {
  // Who checked it.
  UserRef confirmed_by = 1;
  google.protobuf.Timestamp confirmed_at = 2;
}

// Where the payment a document is about stands.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PAID = 1;
  PAYMENT_STATUS_DUE = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_UPCOMING = 4;
  // It doesn't say, or isn't about a payment.
  PAYMENT_STATUS_NONE = 5;
}

// How a vendor charges, as far as a document shows.
enum BillingModel {
  BILLING_MODEL_UNSPECIFIED = 0;
  // A recurring fee: plans and seats.
  BILLING_MODEL_SUBSCRIPTION = 1;
  // Charged for what was used.
  BILLING_MODEL_USAGE = 2;
  // Both subscription and usage charges.
  BILLING_MODEL_MIXED = 3;
  BILLING_MODEL_ONE_TIME = 4;
  BILLING_MODEL_UNKNOWN = 5;
}

// How often something is charged.
enum Interval {
  INTERVAL_UNSPECIFIED = 0;
  INTERVAL_MONTH = 1;
  INTERVAL_YEAR = 2;
  INTERVAL_WEEK = 3;
  INTERVAL_QUARTER = 4;
  INTERVAL_OTHER = 5;
}

// What a line on a document charges for.
enum LineKind {
  LINE_KIND_UNSPECIFIED = 0;
  // Priced per seat or user.
  LINE_KIND_SEAT = 1;
  // A flat recurring fee for a plan.
  LINE_KIND_PLAN = 2;
  // Charged by use: requests, tokens, minutes, overage.
  LINE_KIND_USAGE = 3;
  LINE_KIND_ADDON = 4;
  LINE_KIND_DISCOUNT = 5;
  LINE_KIND_CREDIT = 6;
  LINE_KIND_ONE_TIME = 7;
  LINE_KIND_OTHER = 8;
}

// How something was paid.
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CARD = 1;
  PAYMENT_METHOD_PAYPAL = 2;
  PAYMENT_METHOD_BANK_TRANSFER = 3;
  PAYMENT_METHOD_DIRECT_DEBIT = 4;
  PAYMENT_METHOD_APPLE_PAY = 5;
  PAYMENT_METHOD_GOOGLE_PAY = 6;
  PAYMENT_METHOD_CREDITS = 7;
  PAYMENT_METHOD_INVOICE = 8;
  PAYMENT_METHOD_OTHER = 9;
}

// UsedCard is a card something was paid with, and when last.
message UsedCard {
  // "visa 3776".
  string card = 1;
  // When it last paid, YYYY-MM-DD.
  string last_used = 2;
}
