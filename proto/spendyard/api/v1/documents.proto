syntax = "proto3";

package spendyard.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "spendyard/api/v1/options.proto";

// DocumentService is the active organisation's documents: what arrived (files
// dropped in the browser, forwarded mail, later mailboxes and the CLI's
// pushes), where each is in being read, and what was read from it. Reading
// happens on its own, in the background, as each arrives.
//
// Files go to and come from the blob store directly, by signed URL, not
// through the API: CreateDocumentUpload gives a URL to PUT a file to,
// AddDocument takes it in, GetDocumentOriginal gives a URL to download one
// from.
//
// What was read is ReceiptService's: the receipts and invoices, checking
// them, correcting them.
service DocumentService {
  // ListDocuments lists the documents, newest first, a page at a time. A
  // member sees the ones they added; the owner, admins and an accountant see
  // them all.
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (spendyard.api.v1.permission) = "documents:read";
  }
  // CreateDocumentUpload gives a URL to PUT one file to, good for a few
  // minutes, and the headers to send with it. Once it's there, AddDocument
  // takes it in. At most 25 MB. One call per file: several files are several
  // uploads, each taken in on its own.
  rpc CreateDocumentUpload(CreateDocumentUploadRequest) returns (CreateDocumentUploadResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
  // AddDocument takes in a file put where CreateDocumentUpload said: kept as
  // it came, once (the same bytes, or the same mail by Message-ID, are the
  // document there already), and queued to be read when it's new.
  rpc AddDocument(AddDocumentRequest) returns (AddDocumentResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
  // GetDocument gives one document, read or not: where it is in being read,
  // why it couldn't be, and what it came as. What was read is
  // ReceiptService.GetReceipt's.
  // NOT_FOUND when it isn't the caller's to see.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse) {
    option (spendyard.api.v1.permission) = "documents:read";
  }
  // GetDocumentOriginal gives a URL to download a document as it came, good
  // for a few minutes. NOT_FOUND when it isn't the caller's to see, or its
  // original isn't kept.
  rpc GetDocumentOriginal(GetDocumentOriginalRequest) returns (GetDocumentOriginalResponse) {
    option (spendyard.api.v1.permission) = "documents:read";
  }
  // ReadDocumentAgain queues a document to be read again: one that failed,
  // or one whose reading should be redone. NOT_FOUND when it isn't the
  // caller's to see, or is being read now.
  rpc ReadDocumentAgain(ReadDocumentAgainRequest) returns (ReadDocumentAgainResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
  // DeleteDocument deletes a document for good: what was read from it (a
  // receipt, a statement's payments), what people decided about it, and its
  // original. A payment it was the receipt of is missing one again. It can
  // be added again afterwards. NOT_FOUND when it isn't the caller's to see;
  // FAILED_PRECONDITION while it's being read. Recorded in the activity log.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse) {
    option (spendyard.api.v1.permission) = "documents:write";
  }
}

// Where a document is in being read.
enum DocumentState {
  DOCUMENT_STATE_UNSPECIFIED = 0;
  // Waiting to be read.
  DOCUMENT_STATE_QUEUED = 1;
  // Being read now.
  DOCUMENT_STATE_READING = 2;
  // Read: what was read is in its reading.
  DOCUMENT_STATE_READ = 3;
  // Couldn't be read: `error` says why.
  DOCUMENT_STATE_FAILED = 4;
}

// Document is one document an organisation has, and what was read from it.
message Document {
  // The organisation's own number for it.
  int32 id = 1;
  // The file's name, or the mail's subject.
  string name = 2;
  // Where it came from: `upload:<user id>`, `forward:<address>`, `cli:<machine>`.
  string source = 3;
  // Who sent it, for mail.
  string sender = 4;
  // When it arrived, RFC 3339: the mail's date, or when it was uploaded.
  string received = 5;
  // `email`, `pdf`, `image`, `html`, `text`.
  string format = 6;
  int32 size = 7;
  DocumentState state = 8;
  // Why it couldn't be read, and at which stage (`read`, `options`,
  // `understand`); empty unless it failed.
  string error = 9;
  string error_stage = 10;
  // What was read, when it's about money: the vendor (as edited, if it was),
  // the total and its currency, and the day it was issued (YYYY-MM-DD).
  string vendor_name = 11;
  string total = 12;
  string currency = 13;
  string date = 14;
  // What it is, as its reading says; unset until it's read.
  DocumentType type = 15;
  // The total in the organisation's currency, converted with the European
  // Central Bank's rate of its day, a plain decimal; empty when it's in that
  // currency already, or there's no rate to convert with.
  string converted_total = 16;
  string converted_currency = 17;
  // When it was last read, RFC 3339; empty when it hasn't been.
  string read_at = 18;
}

// Which documents ListDocuments lists.
enum DocumentFilter {
  // All of them.
  DOCUMENT_FILTER_UNSPECIFIED = 0;
  // Those that couldn't be read.
  DOCUMENT_FILTER_FAILED = 1;
  // Those waiting to be read, or being read.
  DOCUMENT_FILTER_READING = 2;
  // Those read.
  DOCUMENT_FILTER_READ = 3;
}

message ListDocumentsRequest {
  // At most this many; 50 when unset.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  // The page after another: the last id it ended with.
  int32 before_id = 2;
  DocumentFilter filter = 3;
  // Only those whose name or sender holds this, whatever its case.
  string query = 4 [(buf.validate.field).string.max_len = 200];
  // Only those from this kind of source: `upload`, `forward`, `cli`, later
  // `gmail`, `outlook`, `imap`.
  string source = 5 [(buf.validate.field).string.pattern = "^[a-z]*$"];
  // Only those that arrived (received) at or after this time; unset for no
  // bound. A day in the asker's own time zone is from its midnight to the next.
  google.protobuf.Timestamp since = 6;
  // Only those that arrived before this time; unset for no bound.
  google.protobuf.Timestamp until = 7;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  // How many the request picks in all, every page together.
  int32 total = 2;
}

message ReadDocumentAgainRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message ReadDocumentAgainResponse {}

message DeleteDocumentRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}
message DeleteDocumentResponse {}

message CreateDocumentUploadRequest {
  // The file's name, as it was chosen.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // Its MIME type, as the browser says; empty when it doesn't.
  string content_type = 2 [(buf.validate.field).string.max_len = 255];
  // Its size in bytes.
  int32 size = 3 [(buf.validate.field).int32 = {
    gt: 0
    lte: 26214400
  }];
}

message CreateDocumentUploadResponse {
  // For AddDocument, once the file is there.
  string upload_id = 1;
  // Where to PUT it, and the headers to send with it.
  string url = 2;
  map<string, string> headers = 3;
}

message AddDocumentRequest {
  string upload_id = 1 [(buf.validate.field).string.min_len = 1];
}

message AddDocumentResponse {
  Document document = 1;
  // It was there already: the same file, or the same mail.
  bool seen = 2;
}

message GetDocumentRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message GetDocumentResponse {
  Document document = 1;
  // What it came as, each with its text, and a link to see and to download
  // the PDFs and pictures; none when the original isn't kept.
  repeated DocumentPart parts = 2;
}

// DocumentPart is one part of a document: the mail's body, an attachment,
// the PDF itself.
message DocumentPart {
  // Its position, as evidence names it.
  int32 index = 1;
  // `body`, `attachment:Invoice.pdf`, `forwarded:1/attachment:Invoice.pdf`.
  string label = 2;
  // `text`, `html`, `pdf`, `image`, `other`.
  string kind = 3;
  string mime = 4;
  // Its plain text: the text itself, HTML as text, a PDF's text layer. Empty
  // for pictures and for PDFs without one.
  string text = 5;
  // Its pages, for a PDF.
  int32 pages = 6;
  // A link to see it as it came, for a while: for a PDF or a picture (not
  // SVG), an email's attachments among them. Empty for the rest.
  string preview_url = 7;
  // A link to download it as it came, for a while, as a file named as it
  // was: for the same parts as preview_url.
  string download_url = 8;
}

message GetDocumentOriginalRequest {
  int32 id = 1 [(buf.validate.field).int32.gt = 0];
}

message GetDocumentOriginalResponse {
  // Where to GET it; it downloads under its own name.
  string url = 1;
}

// What a document is, as its reading says: the CLI's document types.
enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  // Proof that a payment was made.
  DOCUMENT_TYPE_RECEIPT = 1;
  // A request for payment, paid or not.
  DOCUMENT_TYPE_INVOICE = 2;
  // Says a charge is coming; nothing has been paid.
  DOCUMENT_TYPE_RENEWAL_NOTICE = 3;
  // A payment that didn't go through.
  DOCUMENT_TYPE_PAYMENT_FAILED = 4;
  // A card issuer's statement of many charges.
  DOCUMENT_TYPE_CARD_STATEMENT = 5;
  // Anything else: a newsletter, a login code, a quote.
  DOCUMENT_TYPE_OTHER = 6;
  // Money taken off what was billed or given back: a credit note, or a
  // refund's receipt. Its total is the amount credited, positive; status
  // paid when the money went back to a card or account, none when it is
  // credit on account or lowers an unpaid invoice. Spend counts one paid
  // back as money back, below nothing.
  DOCUMENT_TYPE_CREDIT_NOTE = 7;
}
