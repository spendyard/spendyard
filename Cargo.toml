[package]
name = "spendyard"
description = "Reads receipts and invoices from emails, PDFs, images, text and mailboxes, and works out what you're paying for."
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/spendyard/spendyard"

[dependencies]
clap = { version = "4", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
