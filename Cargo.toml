[package]
name = "spendyard"
description = "Reads receipts and invoices from emails, PDFs, images, text and mailboxes, and works out what you're paying for."
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/spendyard/spendyard"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
cfb = "0.16"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
html2text = "0.17"
keyring = "4"
lopdf = { version = "0.47", default-features = false }
mail-parser = "1"
reqwest = { version = "0.13", features = ["form", "json"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust_decimal = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
toml = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
