# The spendyard CLI (this package, src/), and the crates it's built on
# (crates/): the core, which reads documents and builds for WebAssembly so
# Spendyard Cloud runs exactly this code; the model providers; and the core
# for a JavaScript host.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/spendyard/spendyard"

[workspace.dependencies]
spendyard-core = { path = "crates/core" }
spendyard-models = { path = "crates/models" }
async-trait = "0.1"
base64 = "0.23"
futures-util = "0.3"
mail-parser = "1"
reqwest = { version = "0.13", features = ["form", "json"] }
rust_decimal = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "spendyard"
description = "Reads receipts and invoices from emails, PDFs, images, text and mailboxes, and works out what you're paying for."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spendyard-core.workspace = true
spendyard-models.workspace = true
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures-util.workspace = true
gethostname = "1"
keyring = "4"
mail-parser.workspace = true
reqwest.workspace = true
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
rpassword = "7"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust_decimal.workspace = true
rustls-platform-verifier = "0.7"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tokio-rustls = "0.26"
toml.workspace = true

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The WebAssembly core (scripts/build-wasm.sh): as small as it goes, and not
# stripped, so wasm-bindgen can see which Wasm features it uses. wasm-opt
# strips it after.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
strip = false

